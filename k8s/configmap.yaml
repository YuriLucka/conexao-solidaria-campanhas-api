apiVersion: v1
kind: ConfigMap
metadata:
  name: campanhas-api-config
  namespace: conexao-solidaria
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  RabbitMq__Host: "rabbitmq"
  ConnectionStrings__Redis: "redis:6379"
  JwtSettings__Issuer: "conexao-solidaria"
  JwtSettings__Audience: "conexao-solidaria"
  JwtSettings__ExpirationMinutes: "15"
  JwtSettings__RefreshTokenDays: "7"
  # Dados de demonstração (gestora, doadora e campanhas com datas relativas à subida).
  Seed__Enabled: "true"
  # Conta da ONG criada na primeira subida, mesmo com o seed desligado. A senha vem do Secret.
  GestorInicial__Nome: "Helena Martins"
  GestorInicial__Email: "helena@esperancasolidaria.demo"
  Cors__Origens: "http://localhost:8000,http://localhost:8080"
